name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Lint needs no compiled output, so it runs first and fails fast.
      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Workspaces are built in dependency order: the API and web app consume
      # the packages' compiled output and type declarations.
      - name: Build packages
        run: |
          npm run build -w @trip/shared
          npm run build -w @trip/providers
          npm run build -w @trip/llm
          npm run build -w @trip/engine

      # Explicit and separate from the build, so a type error is reported as a
      # type error in every workspace, including the web app, whose production
      # build would otherwise be the first thing to notice.
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm run test --workspaces --if-present

      - name: Build applications
        run: |
          npm run build -w @trip/api
          npm run build -w @trip/web

  # The store contract, and the whole request path, against a real PostgreSQL:
  # the migrations are applied to an empty database, so a migration that cannot
  # apply fails here rather than on a deploy. Both stores (in-memory and
  # PostgreSQL) run the same contract, which is what keeps "the in-memory store
  # behaves like the database" true.
  integration:
    name: PostgreSQL integration and smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trip
          POSTGRES_PASSWORD: trip
          POSTGRES_DB: trip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trip -d trip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Must name a disposable database: the tests empty its tables.
      TEST_DATABASE_URL: postgresql://trip:trip@localhost:5432/trip_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build packages
        run: |
          npm run build -w @trip/shared
          npm run build -w @trip/providers
          npm run build -w @trip/llm
          npm run build -w @trip/engine

      - name: Integration tests
        run: npm run test:integration -w @trip/api

      # The built API and worker against a throwaway database, driven over HTTP
      # the way the web app drives it.
      - name: Smoke run
        run: |
          npm run build -w @trip/api
          npm run smoke -w @trip/api
          # Again with the worker as its own process, the shape to expect in production.
          npm run smoke -w @trip/api -- --split

  secrets:
    name: No committed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a key committed and then removed is still a leaked key.
          fetch-depth: 0

      - name: Scan history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. It holds provider credentials and must never be committed."
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # High and critical advisories fail the build; lower severities are
      # reported without blocking a pull request on transitive noise.
      - run: npm audit --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
